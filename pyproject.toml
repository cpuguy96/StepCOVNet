[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stepcovnet"
version = "2.0.0"
description = "Audio to StepMania note generator using convolutional neural networks"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache License 2.0" }
authors = [
    { name = "cpuguy96" }
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["stepmania", "rhythm-game", "music", "neural-network", "deep-learning"]

# Core: library, scripts, and notebooks (run + execute)
dependencies = [
    "tensorboard",
    "tensorflow",
    "librosa",
    "scipy",
    "matplotlib",
    "gdown",
    "notebook",
]

[project.optional-dependencies]
# Building the standalone Generator UI executable (PyInstaller)
build = ["pyinstaller"]
# Testing, coverage, linting, notebook tests
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "nbmake",
    "psutil",
]
gpu = ["tensorflow[and-cuda]"]
gpu-dev = ["stepcovnet[dev,gpu]"]
ssl = ["torch", "transformers", "accelerate"]
ssl-dev = ["stepcovnet[dev,ssl]"]

[project.urls]
Homepage = "https://github.com/cpuguy96/StepCOVNet"
Repository = "https://github.com/cpuguy96/StepCOVNet.git"
Issues = "https://github.com/cpuguy96/StepCOVNet/issues"

# ------------------------------------------------------------------
# Tool Configurations
# ------------------------------------------------------------------

[tool.setuptools.packages.find]
where = ["src"]
include = ["stepcovnet*"]
namespaces = false

# Pytest Configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --tb=short --cov=stepcovnet --cov=scripts"
testpaths = ["tests"]
python_files = ["*_test.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "memory: marks tests that measure memory (deselect with '-m \"not memory\"')",
]

# Coverage Configuration
[tool.coverage.run]
source = ["stepcovnet", "scripts"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# Type checkers: resolve script imports from tests (e.g. import generate_ui → scripts/generate_ui.py)
[tool.pyright]
extraPaths = ["scripts"]

[tool.mypy]
mypy_path = "scripts"

# Ruff (lint + format)
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.isort]
known-first-party = ["stepcovnet"]
