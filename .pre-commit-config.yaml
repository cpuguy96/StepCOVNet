# Local hooks: ruff on commit only. Full CI mirror is manual (see below).
#
# One-time setup (repo root, dev venv active):
#   pip install pre-commit
#   pre-commit install --install-hooks --hook-type pre-commit
#
# Full CI mirror (same as GitHub Actions; run before push when you want parity):
#   venv\Scripts\python.exe pre_submit.py --skip-install
#   bash pre_submit.sh --skip-install
#
# Ruff only (~seconds):
#   venv\Scripts\python.exe pre_submit.py --fast
#
# Pre-push full-suite hook is intentionally disabled (too slow). Re-enable later
# with a faster subset once pre_submit is split into quick vs full targets.

default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff-check
      - id: ruff-format
